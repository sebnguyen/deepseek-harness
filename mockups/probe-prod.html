<!doctype html>
<html>
<head><meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html,body{margin:0;height:100%;background:#101418}canvas{display:block;width:100%;height:100%}</style>
</head>
<body data-ds-dark-theme>
<canvas id="c"></canvas>
<div id="err" style="position:fixed;top:0;left:0;color:#f66;font:12px monospace;white-space:pre"></div>
<script>
window.addEventListener('error', e => {
  document.getElementById('err').textContent = 'PAGE-ERR: ' + e.message + ' @ ' + (e.filename||'').split('/').pop() + ':' + e.lineno
}, true)
</script>
<script type="importmap">
{"imports":{"twgl.js":"../packages/client/ui-layout/node_modules/twgl.js/dist/7.x/twgl-full.module.js"}}
</script>
<script type="module">
console.log('importmap parsed')
try {
  const mod = await import('./ocean-shader-probe.mjs').catch(e => {
    document.getElementById('err').textContent = 'IMPORT-FAIL: ' + (e.message || e)
    throw e
  })
  const canvas = document.getElementById('c')
  const handle = mod.mountOceanShader(canvas, { reduced: false, running: location.hash !== '#idle' })
  if (handle === null) {
    document.getElementById('err').textContent = 'NULL-HANDLE'
  } else {
    document.getElementById('err').textContent = 'MOUNTED'
    window.__h = handle
  }
} catch (e) {
  document.getElementById('err').textContent = 'BOOT-ERR: ' + (e.stack || e.message || e)
}
</script>
</body>
</html>
