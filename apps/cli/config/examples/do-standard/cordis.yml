# DO Standard Bundle — cordis.patch.yml
# ==============================================================================
# A single `--patch` overlay that points new sessions at DigitalOcean
# inference, widens the language-server map dsh-base ships, and prices the
# session-stats chip at DO rates. The digitalocean route itself ships in
# dsh-base with no stored models — it serves the inference endpoint's live
# model listing.
#
# Usage:
#   dsh --profile web    --patch do-standard-bundle.patch.yml
#   dsh --profile headless --patch do-standard-bundle.patch.yml "task"
#
# Home-level (applies to every profile automatically):
#   cp do-standard-bundle.patch.yml ~/.dsh/cordis.patch.yml
#
# Prerequisites (see guides at the bottom):
#   - DO_INFERENCE_API_KEY  environment variable (DO inference)
#   - gopls                  on PATH (Go LSP)
#   - rust-analyzer          on PATH (Rust LSP)
#   - docker                 on PATH (SearXNG — shipped in dsh-base; no patch needed)
# ==============================================================================

# ── LSP: add language servers to the provider dsh-base mounts ─────────────────
# dsh-base already mounts the `lsp` seam, the stdio provider with gopls for
# `.go`, and the `lsp` and `symbols` tools, so this overlay only replaces the
# server map: a config override replaces the whole block, so restate every
# server you want to keep. Add more entries for TypeScript, Python, etc.; see
# the setup guides at the bottom of this file for installing each server.
- id: lsp-stdio
  disabled: false
  config:
    servers:
      go:
        command: gopls
        extensionToLanguage:
          '.go': go
      rust:
        command: rust-analyzer
        extensionToLanguage:
          '.rs': rust

# ── DO inference ────────────────────────────────────────────────────────────
# dsh-base ships the digitalocean route — endpoint, protocol, and wire quirks
# ride the plugin's shipped catalog — with no stored models: the route
# interrogates https://inference.do-ai.run/v1/models and serves what the API
# lists, so this overlay stores nothing model-shaped.  The API key lives in
# the environment (DO_INFERENCE_API_KEY), never in this file.

# ── Disable the native DeepSeek adapter (no key) ──────────────────────────────
- id: llm-deepseek
  disabled: true

# ── Default new sessions to DO ────────────────────────────────────────────────
- id: agent-default-model
  config:
    provider: digitalocean
    model: qwen3.8-max
    temperature: 0.2

# ==============================================================================
# SETUP GUIDES
# ==============================================================================
# Copy and paste the relevant section for your OS.  Each guide installs ONE
# language server; repeat for every language you want LSP support for.
#
# ── Go (gopls) ────────────────────────────────────────────────────────────────
#
#   macOS:
#     brew install gopls
#
#   Linux:
#     go install golang.org/x/tools/gopls@latest
#     # Ensure $(go env GOPATH)/bin is on your PATH.
#
#   Verify:
#     gopls version
#
# ── Rust (rust-analyzer) ──────────────────────────────────────────────────────
#
#   Any OS (rustup):
#     rustup component add rust-analyzer
#
#   macOS (brew):
#     brew install rust-analyzer
#
#   Verify:
#     rust-analyzer --version
#
# ── TypeScript/JavaScript (add to `servers` above) ────────────────────────────
#
#   Any OS:
#     npm install -g typescript-language-server typescript
#
#   Add to lsp-stdio config:
#     typescript:
#       command: typescript-language-server
#       args: ['--stdio']
#       extensionToLanguage:
#         '.ts': typescript
#         '.tsx': typescriptreact
#         '.js': javascript
#         '.jsx': javascriptreact
#
# ── Python (add to `servers` above) ───────────────────────────────────────────
#
#   Any OS:
#     pip install pyright
#
#   Add to lsp-stdio config:
#     python:
#       command: pyright-langserver
#       args: ['--stdio']
#       extensionToLanguage:
#         '.py': python
#
# ── DO Inference API Key ──────────────────────────────────────────────────────
#
#   Set the environment variable before starting dsh:
#     export DO_INFERENCE_API_KEY="dop_v1_..."
#
#   Or add to ~/.dsh/.credentials.yaml (see dsh docs for credential format).
#   The API key is available from the DigitalOcean cloud console under
#   API &rarr; Tokens/Keys.
#
#   Select a model via settings or AgentOptions:
#     Settings:  provider: digitalocean, model: deepseek-v4-pro
#     Reasoning: reasoningEffort: medium  (for reasoning-capable models)
#
# ── SearXNG Web Search ────────────────────────────────────────────────────────
#
#   No patch needed — dsh-base already ships web-search-searxng.  The provider
#   requires Docker on the host:
#
#   macOS:
#     brew install --cask docker
#     open -a Docker       # start the daemon
#
#   Linux:
#     # Install Docker Engine: https://docs.docker.com/engine/install/
#     sudo systemctl start docker
#
#   Verify:
#     docker info
#
#   The first search pulls searxng/searxng:latest and starts a container
#   (can take ~30-90s for the initial pull + startup).  Subsequent searches
#   reuse the running container.  No API key or account is needed.
#
#   If you want to skip SearXNG and use a keyed search provider instead,
#   patch the `web` row:
#     - id: web
#       config:
#         searchProvider: exa         # needs EXA_API_KEY
#         # searchProvider: deepseek  # needs DEEPSEEK_API_KEY

# ── per-scope cost chip rates ────────────────────────────────────────────────
# Overrides the bundled session-stats pricing row (later patch layers
# configure rows earlier layers inserted). Flat rates price the deployment
# default route; pricing.models re-rates every other catalog model at the
# DigitalOcean serverless inference table. Dropping the block leaves the
# bundled default in force.
- id: session-stats
  config:
    pricing:
      inputPerMillionUsd: 0.14
      outputPerMillionUsd: 0.28
      cacheReadPerMillionUsd: 0.028
      cacheWritePerMillionUsd: 0
      # Flat DO serverless inference rates; per-model rates would drift with
      # the live catalog, so the chip prices the default route only.
