# Keyless replay keeps the LSP composition intact and replaces only the model adapter.
# `lsp`, `lsp-stdio`, and `tool-lsp` ship in dsh-base; the replay patch reconfigures
# them (fixture provider, narrowed result window) rather than re-inserting them.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: true

- id: lsp-stdio
  config:
    servers:
      fixture:
        command: !!js process.execPath
        args: ['./lsp-server.mjs']
        extensionToLanguage:
          '.ts': typescript
- id: tool-lsp
  config:
    maxLocations: 1

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro

- id: timeout-policy
  name: '@deepseek-ai/dsh-tool-call-timeout-policy'
