# Exercise the model-facing LSP tool through the shipped Loader entry path.
# `lsp` and `lsp-stdio` ship in dsh-base; the scenario only reconfigures them:
# the fixture provider replaces the default server list and the tool config
# narrows the result window.
- id: lsp-stdio
  config:
    servers:
      fixture:
        command: !!js process.execPath
        args: ['./lsp-server.mjs']
        extensionToLanguage:
          '.ts': typescript
- id: tool-lsp
  config:
    maxLocations: 1

- id: timeout-policy
  name: '@deepseek-ai/dsh-tool-call-timeout-policy'
