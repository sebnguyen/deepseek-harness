# Twin build and publication lane for the embedded VS Code frame.
#
# Pack-style proof without credentials on every pull request and master
# push: the dry run prints the exact command plan against the pinned seat
# and the overlay's apply-check rides the lane's spec. Publication of a
# recorded twin row is a manual workflow_dispatch of release-publish-style
# review once a runner has produced the artifacts; the repository never
# carries twin payloads.
name: IDE twin lane

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Twin lane dry run
    runs-on: >-
      ${{ vars.DSH_CI_FAILOVER_LINUX == 'selfhosted'
        && github.repository == 'deepseek-harness/deepseek-harness'
        && github.actor != 'dependabot[bot]'
        && ((github.event_name == 'push' && github.ref == 'refs/heads/master')
          || (github.event_name == 'pull_request'
            && github.event.pull_request.head.repo.full_name == github.repository
            && github.event.pull_request.head.repo.fork == false
            && github.event.pull_request.user.login != 'dependabot[bot]'))
        && fromJSON('["self-hosted", "linux", "x64", "vm-backup"]')
        || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Dry run the twin lane
        run: pnpm exec tsx scripts/ide/build.ts --dry-run
