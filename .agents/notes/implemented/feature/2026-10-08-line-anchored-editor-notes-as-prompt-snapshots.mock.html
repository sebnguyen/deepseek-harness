<!doctype html>
<!-- Interactive mock v2, rebuilt on the SHIPPED web chrome, not an invented one:
     right sidebar = dockkit tab strip (28px tabs, 12px radius, active on
     markdown-tag) over the editor tab (root bg-layer-1, footer with the
     segmented Edit/Preview/Changes toggle on interactive-bg-hover, 0.5px
     border-l2 Save/Revert buttons); the code surface is the CodeMirror theme
     geometry from editor.ts (13px/1.7 --ds-font-family-code, caption-colored
     gutter numbers with a 0.5px border-l1 right rule and 0 8px 0 12px padding,
     16px line padding, hovered line on interactive-bg-hover) with editor.ts's
     token palette (keyword business-primary, string success-primary, number
     warn-primary, type warn-label, punctuation label-secondary); the Changes
     display is ChangesSurface verbatim (24px strip on bg-layer-2, 2px rail on
     border-l2, 2x10 brand ticks, 11px playhead, 12px-radius purpose box on
     bg-layer-2, 28px round + quote button on bg-layer-3), note stops riding the
     scrubber as the warn diamond geometry filled; the composer is InputBar's
     card (22px radius, specific-input-major, elevation-soft with a border-l2
     stroke, 14/24 input, 34px round info-fill send, 28px round attach) and notes
     quote as INLINE reference chips in business-primary ink (padding 0 4px,
     6px radius, business-tertiary hover fill, 14px glyph) exactly like shipped
     @-mentions; the + affordance and note reader ride HoverCard chrome
     (#202426, 12px radius, shadow-lv3) with shipped tooltips (bluish-700
     bubble, 13/20, 500ms). All colors are the dark resolved --dsw-* alias
     values (design-platform.css body[data-ds-dark-theme]); motion rides the
     --ds-* easing/duration variables behind a prefers-reduced-motion guard;
     every full-round shape pairs corner-shape: round under @supports. -->

<style>

  [5, "<span class='kw'>export async function</span> <span class='fn'>handle</span><span class='op'>(</span>req<span class='op'>:</span> <span class='ty'>Request</span><span class='op'>)</span> <span class='op'>{</span>"],
  [6, "  <span class='kw'>const</span> token <span class='op'>=</span> req<span class='op'>.</span>headers<span class='op'>.</span><span class='fn'>get</span><span class='op'>(</span><span class='st'>'authorization'</span><span class='op'>)</span>"],
  [7, "  <span class='kw'>if</span> <span class='op'>(!</span>token<span class='op'>)</span> <span class='kw'>return</span> <span class='fn'>respond</span><span class='op'>(</span><span class='nu'>401</span><span class='op'>)</span>"],
  [8, "  <span class='kw'>const</span> user <span class='op'>=</span> <span class='kw'>await</span> <span class='fn'>verify</span><span class='op'>(</span>token<span class='op'>)</span>"],
  [9, "  <span class='kw'>if</span> <span class='op'>(</span>user <span class='op'>===</span> <span class='nu'>undefined</span><span class='op'>)</span> <span class='kw'>return</span> <span class='fn'>respond</span><span class='op'>(</span><span class='nu'>401</span><span class='op'>)</span>"],
  [10, "  AUDIT<span class='op'>.</span><span class='fn'>record</span><span class='op'>(</span>user<span class='op'>.</span>id<span class='op'>,</span> req<span class='op'>.</span>url<span class='op'>)</span>"],
  [11, "  <span class='kw'>return</span> <span class='fn'>route</span><span class='op'>(</span>user<span class='op'>,</span> req<span class='op'>)</span>"],
  [12, "<span class='op'>}</span>"],
  [13, ''],
  [14, "<span class='kw'>function</span> <span class='fn'>respond</span><span class='op'>(</span>status<span class='op'>:</span> <span class='ty'>number</span><span class='op'>)</span> <span class='op'>{</span>"],
  [15, "  <span class='kw'>return new</span> <span class='ty'>Response</span><span class='op'>(</span><span class='nu'>null</span><span class='op'>,</span> <span class='op'>{</span> status <span class='op'>})</span>"],
  [16, "<span class='op'>}</span>"],
]
let NOTES = [
  { id: 1, line: 7, turn: 2, text: 'This early 401 skips the audit sink — record an auth.rejected entry before responding.', frozen: '  if (!token) return respond(401)', digest: 'sha256:41c2e8' },
]
let nextId = 2
let mode = 'edit'
let selStop = 1
let chips = []
const addr = n => `@${FILE}#L${n.line}#note-${n.id}`
const plain = line => (PLAIN.find(l => l[0] === line) ?? [line, ''])[1]
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
const stops = () => [{ turn: 1, kind: 'write', title: 'write · turn 1', meta: 'call-7f3a · after sha256:0b91aa', body: 'create handler with auth gate', diff: [[5, 'add', 'export async function handle(req: Request) {'], [7, 'add', '  if (!token) return respond(401)'], [12, 'add', '}']] },
  ...NOTES.map(n => ({ turn: n.turn, kind: 'note', note: n, title: '✎ note-' + n.id + ' · line ' + n.line, meta: addr(n) + ' · ' + n.digest, body: n.text, diff: [[n.line, 'noted', n.frozen]] }))].sort((a, b) => a.turn - b.turn)

/* tooltips, shipped bubble with the consumer's 500ms dwell */
let tipEl = null, tipTimer = 0
function tip(text, x, y) {
  untip()
  tipTimer = setTimeout(() => {
    tipEl = document.createElement('div')
    tipEl.className = 'tooltip'
    tipEl.textContent = text
    tipEl.style.left = Math.min(x, innerWidth - 260) + 'px'
    tipEl.style.top = (y + 24) + 'px'
    document.body.appendChild(tipEl)
  }, 500)
}
function untip() { clearTimeout(tipTimer); if (tipEl) { tipEl.remove(); tipEl = null } }
document.addEventListener('mouseover', e => { const t = e.target.closest('[data-tip]'); if (t) { const r = t.getBoundingClientRect(); tip(t.dataset.tip, r.left, r.top) } })
document.addEventListener('mouseout', e => { if (!e.relatedTarget?.closest?.('[data-tip]')) untip() })

function renderEditor() {
  const body = document.getElementById('edbody')
  const strip = document.getElementById('strip')
  if (mode === 'edit') {
    strip.hidden = true
    body.innerHTML = '<div class="ecode">' + HL.map(([n, code]) => {
      const note = NOTES.find(x => x.line === n)
      const rail = note
        ? `<button class="marker" type="button" data-tip="note-${note.id} · ${esc(note.text.slice(0, 60))}" onclick="openNote(${note.id})">✎</button>`
        : `<button class="plus" type="button" data-tip="Add a note on line ${n}" onclick="openCreate(${n})">+</button>`
      return `<div class="ln${note ? ' hasnote' : ''}"><span class="act">${rail}</span><span class="g">${n}</span><span class="c">${code}</span></div>`
    }).join('') + '</div>'
  } else {
    const S = stops()
    selStop = Math.min(selStop, S.length - 1)
    const cur = S[selStop]
    const turns = S.map(s => s.turn)
    const min = Math.min(...turns), max = Math.max(...turns)
    const pct = t => (max === min ? 50 : ((t - min) / (max - min)) * 86 + 7)
    strip.hidden = false
    strip.innerHTML = `<span class="edge">t${min}</span><div class="track"><div class="line"></div>` + S.map((s, i) =>
      `<button class="tick${i === selStop ? ' on' : ''}" type="button" style="left:${pct(s.turn)}%" data-tip="${esc(s.title)}" onclick="selStopAt(${i})">${s.kind === 'note' ? '<span class="dia"></span>' : ''}</button>`).join('') +
      `<span class="playh" style="left:${pct(cur.turn)}%"></span></div><span class="edge">t${max}</span>`
    body.innerHTML = '<pre class="diff">' + cur.diff.map(([n, kind, text]) =>
      `<div class="ln ${kind}"><i>${n}</i><span class="c">${kind === 'add' ? '+ ' : kind === 'del' ? '- ' : '  '}${esc(text)}</span></div>`).join('') + '</pre>'
      + `<div class="prow"><button class="addb" type="button" data-tip="Quote this stop into the composer" onclick="${cur.kind === 'note' ? `quote(${cur.note.id})` : ''}">＋</button><div class="pbox"><span class="ttl">${esc(cur.title)}<span class="meta">${esc(cur.meta)}</span></span><p>${esc(cur.body)}</p></div></div>`
  }
  document.getElementById('m-edit').setAttribute('aria-pressed', String(mode === 'edit'))
  document.getElementById('m-chg').setAttribute('aria-pressed', String(mode === 'changes'))
}
function setMode(m) { mode = m; closePop(); renderEditor() }
document.getElementById('m-edit').onclick = () => setMode('edit')
document.getElementById('m-chg').onclick = () => setMode('changes')
function selStopAt(i) { selStop = i; renderEditor() }

/* note popovers on HoverCard chrome */
function closePop() { const p = document.getElementById('pop'); if (p) p.remove() }
function mount(line) {
  closePop()
  const el = document.createElement('div')
  el.className = 'pop'
  el.id = 'pop'
  const idx = HL.findIndex(l => l[0] === line)
  el.style.top = (6 + (idx + 1) * 22.1 + 2) + 'px'
  document.getElementById('edbody').appendChild(el)
  return el
}
function openCreate(line) {
  const el = mount(line)
  el.innerHTML = `<div class="ph"><span class="addr">${FILE}:${line}</span><span>· ${esc(plain(line))}</span></div>
    <textarea id="poptext" placeholder="What should the agent know about this line?"></textarea>
    <div class="pbtns"><button class="pbtn" type="button" onclick="closePop()">Cancel</button><button class="pbtn primary" type="button" onclick="addNote(${line})">Add note</button></div>`
  el.querySelector('textarea').focus()
}
function openNote(id) {
  const n = NOTES.find(x => x.id === id)
  if (!n) return
  const el = mount(n.line)
  el.innerHTML = `<div class="ph"><span class="addr">${addr(n)}</span><span>· frozen at turn ${n.turn} · ${n.digest}</span></div>
    <code class="frozen">${esc(n.frozen)}</code>
    <div class="pbtns"><p class="note-text">${esc(n.text)}</p><button class="pbtn danger" type="button" onclick="delNote(${id})">Delete</button><button class="pbtn" type="button" onclick="closePop()">Close</button><button class="pbtn primary" type="button" onclick="quote(${id})">Quote ＋</button></div>`
}
function addNote(line) {
  const text = document.getElementById('poptext').value.trim()
  if (!text) { document.getElementById('poptext').focus(); return }
  NOTES.push({ id: nextId++, line, turn: 4, text, frozen: plain(line), digest: 'sha256:' + Math.random().toString(16).slice(2, 8) })
  closePop(); renderEditor()
}
function delNote(id) {
  NOTES = NOTES.filter(n => n.id !== id)
  chips = chips.filter(c => c !== id)
  closePop(); renderEditor(); renderChips()
}
function quote(id) {
  if (!chips.includes(id)) chips.push(id)
  closePop(); renderChips()
  document.getElementById('drafttext').focus()
}
function unchip(id) { chips = chips.filter(c => c !== id); renderChips() }
const PENCIL = '<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 11l7-7 3 3-7 7H2v-3z" stroke="currentColor"/></svg>'
function renderChips() {
  const host = document.getElementById('cinput')
  host.querySelectorAll('.refChip').forEach(el => el.remove())
  const input = document.getElementById('drafttext')
  for (const id of chips) {
    const n = NOTES.find(x => x.id === id)
    if (!n) continue
    const chip = document.createElement('span')
    chip.className = 'refChip'
    chip.title = n.text + '\n' + n.frozen
    chip.innerHTML = PENCIL + addr(n)
    chip.onclick = () => openNote(id)
    host.insertBefore(chip, input)
  }
}
function send() {
  const text = document.getElementById('drafttext').value
  if (!text && chips.length === 0) return
  const msg = document.createElement('div')
  msg.className = 'msg user'
  msg.innerHTML = chips.map(id => {
    const n = NOTES.find(x => x.id === id)
    return `<span class="refChip">${PENCIL}${addr(n)}</span>`
  }).join(' ') + (chips.length && text ? ' ' : '') + esc(text)
  document.getElementById('chain').appendChild(msg)
  chips = []
  document.getElementById('drafttext').value = ''
  renderChips()
  document.getElementById('chain').scrollTop = 1e6
}
document.getElementById('send').onclick = send
document.getElementById('drafttext').addEventListener('keydown', e => { if (e.key === 'Enter') send() })
addEventListener('keydown', e => { if (e.key === 'Escape') closePop() })
document.addEventListener('click', e => { if (!e.target.closest('.pop,.marker,.plus,.tick,.refChip,.addb')) closePop() })
renderEditor()
</script>
</body>
</html>
