# Reasoning-prefetch profile layer for profiles that do not stack dsh-base
# (base inserts the same row, enabled, by default): stack after any profile
# that runs an agent loop, an fs provider, and a reasoning-capable adapter.
# The row carries no config here; user layers address `id: reasoning-prefetch`
# to set budgets per deployment or disable the row.

- insert:
    - id: reasoning-prefetch
      name: '@deepseek-ai/dsh-experimental-reasoning-prefetch'
