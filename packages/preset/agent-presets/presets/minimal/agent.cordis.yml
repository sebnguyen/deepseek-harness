# The `minimal` agent preset: a fixed-prompt, single-tool coding-agent composition.
#
# The persona is the complete system prompt, so global identity, Web orientation,
# tool guidance, and later assembly listeners cannot add prompt text. Runtime
# context snapshots are suppressed for this preset, and the model receives the
# one-shot shell (`bash` on POSIX, `pwsh` on win32). Navigation tools are
# deliberately absent: this preset keeps the fixed tool set its training
# configuration names. Context compaction is absent.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: You are a helpful software engineer assistant.
    complete: true
    includeRuntimeContext: false

# The one-shot `bash` tool: its `commands` face runs several independent
# commands in one call, each settling into its own labeled frame, and every
# element still pays a fresh shell. Exactly one shell stack mounts per host: the
# bash stack gates off win32 and its pwsh twin gates off POSIX.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash-frames'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'
